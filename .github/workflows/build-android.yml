name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🔑 1. DECODE THE KEYSTORE FIRST
      - name: Create Keystore File from Base64
        run: |
          mkdir -p src-capacitor/android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src-capacitor/android/app/release-key.jks

      # 🚀 2. SYNC AND COMPILE WEB ASSETS VIA QUASAR
      - name: Build Quasar Project
        run: npx @quasar/cli build -m capacitor -T android --skip-pkg

      # 📦 3. COMPILE AND SIGN THE FINISHED APK VIA GRADLE
      - name: Build signed APK
        working-directory: src-capacitor/android
        env:
          KEYSTORE_PATH: app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 📤 4. UPLOAD EXECUTABLE ARTIFACT
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: src-capacitor/android/app/build/outputs/apk/release/app-release.apk
